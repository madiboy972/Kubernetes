apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nginxMain.name }}-html
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.nginxMain.name }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
data:
  index.html: |
    {{ .Values.nginxMain.content | nindent 4 }}
