apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nginxMain.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.nginxMain.name }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.nginxMain.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.nginxMain.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.nginxMain.name }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.nginxMain.port }}
          resources:
            {{- toYaml .Values.nginxMain.resources | nindent 12 }}
          volumeMounts:
            - name: html-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.nginxMain.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.nginxMain.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: html-content
          configMap:
            name: {{ .Values.nginxMain.name }}-html
